<script>
  window.PINNED = null;  // the server writes in the preferences pinned on this Mac
  // Pinned preferences come first: this browser's own are replaced with them before anything reads one.
  (function () { var p = window.PINNED; if (!p) return; try { for (var k in p.prefs) localStorage.setItem(k, p.prefs[k]); } catch (e) {} })();
  // The theme is applied before first paint so there is no flash. Auto follows the Mac.
  (function () {
    var pref = 'auto', mq = matchMedia('(prefers-color-scheme: dark)');
    try { pref = localStorage.getItem('theme') || 'auto'; } catch (e) {}
    function apply() { document.documentElement.dataset.theme = pref === 'auto' ? (mq.matches ? 'dark' : 'light') : pref; }
    window.setTheme = function (p) { pref = p; try { localStorage.setItem('theme', p); } catch (e) {} apply(); if (window.prefChanged) window.prefChanged(); };
    window.getTheme = function () { return pref; };
    mq.addEventListener('change', apply); apply();
  })();
</script>

<script>
const $ = id => document.getElementById(id);
const scroller = () => document.querySelector('.scroll');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* Icons: 16 px grid, 1.5 px line (DESIGN.md) */
const ICONS = {
  playlist: '<path d="M2.5 4h8M2.5 7.5h8M2.5 11h5"/><path d="M12 9.5v4"/><path d="M10 11.5h4"/>',

  soundOff: '<path d="M2.5 6.2v3.6h2.3L8 12.5v-9L4.8 6.2z"/><path d="M10.5 6.3l3 3.4M13.5 6.3l-3 3.4"/>',

  more: '<circle cx="3.5" cy="8" r="1"/><circle cx="8" cy="8" r="1"/><circle cx="12.5" cy="8" r="1"/>',
  albums: '<rect x="2" y="2" width="12" height="12" rx="2"/><circle cx="8" cy="8" r="3"/>',
  trash: '<path d="M3 4.5h10M6.2 4.5V3a.8.8 0 0 1 .8-.8h2a.8.8 0 0 1 .8.8v1.5M4.3 4.5l.6 8.3a1 1 0 0 0 1 .9h4.2a1 1 0 0 0 1-.9l.6-8.3"/>',
  moveto: '<path d="M2.5 5a1.5 1.5 0 0 1 1.5-1.5h2.6l1.4 1.6h4A1.5 1.5 0 0 1 13.5 6.6v5A1.5 1.5 0 0 1 12 13.1H4a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M5.8 8.6h4.4M8.6 7l1.6 1.6-1.6 1.6"/>',
  copies: '<rect x="5.4" y="2.4" width="8.2" height="8.2" rx="1.8"/><path d="M2.4 5.8v6a1.8 1.8 0 0 0 1.8 1.8h6"/><path d="M9.5 8.2V4.8l2-.5"/><circle cx="8.4" cy="8.2" r="1.1"/>',
  redo: '<path d="M10.5 3.5l3 3-3 3M13 6.5H7a4 4 0 0 0 0 8h3"/>',

  artists: '<circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.8-2.6 2.7-3.8 5-3.8s4.2 1.2 5 3.8"/>',
  songs: '<path d="M6 12.5V3.5l7-1.5v9"/><circle cx="4.5" cy="12.5" r="1.5"/><circle cx="11.5" cy="11" r="1.5"/>',
  add: '<circle cx="8" cy="8" r="6"/><path d="M8 5.5v5M5.5 8h5"/>',
  tag: '<path d="M2.5 8.2V2.5h5.7l5.3 5.3a1.2 1.2 0 0 1 0 1.7l-4 4a1.2 1.2 0 0 1-1.7 0z"/><circle cx="5.5" cy="5.5" r="1"/>',
  eject: '<path d="M3.5 10.2L8 4.2l4.5 6z"/><path d="M3.5 13h9"/>',
  edit: '<path d="M10.5 2.5l3 3-7.5 7.5H3v-3z"/><path d="M9 4l3 3"/>',
  backup: '<path d="M2.5 8a5.5 5.5 0 1 0 1.7-4"/><path d="M2.3 2.5v3.2h3.2"/><path d="M8 5v3.2l2 1.3"/>',
  covers: '<rect x="2" y="3" width="12" height="10" rx="2"/><circle cx="6" cy="7" r="1.2"/><path d="M3 12l3.5-3.5 2.5 2.5 2-2 3 3"/>',
  search: '<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>',
  reload: '<path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5v3h-3"/>',
  sun: '<circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/>',
  moon: '<path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/>',
  auto: '<circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11a5.5 5.5 0 0 0 0-11z" fill="currentColor"/>',
  check: '<path d="M3.5 8.5l3 3 6-7"/>',
  pin: '<path stroke-linejoin="round" d="M5.6 2.5h4.8M6.4 2.5v3.8L4.2 9h7.6L9.6 6.3V2.5M8 9v4.5"/>',
  pinned: '<path fill="currentColor" stroke-linejoin="round" d="M5.6 2.5h4.8M6.4 2.5v3.8L4.2 9h7.6L9.6 6.3V2.5z"/><path d="M8 9v4.5"/>',
  pulse: '<path d="M1.8 8.4h2.9l1.6-4 2.6 7.6 1.7-3.6h3.6"/>',
  info: '<circle cx="8" cy="8" r="6"/><path d="M8 7.4v3.6M8 5.1v.01"/>',
  star: '<path stroke-linejoin="round" d="M8 2.2l1.7 3.6 3.9.5-2.9 2.7.8 3.9L8 11l-3.5 1.9.8-3.9L2.4 6.3l3.9-.5z"/>',
  starred: '<path fill="currentColor" stroke-linejoin="round" d="M8 2.2l1.7 3.6 3.9.5-2.9 2.7.8 3.9L8 11l-3.5 1.9.8-3.9L2.4 6.3l3.9-.5z"/>',
  bang: '<path d="M8 3.5v5.5M8 12v.01"/>',
  xmark: '<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>',
  slash: '<circle cx="8" cy="8" r="5.5"/><path d="M4.2 11.8l7.6-7.6"/>',

  warn: '<path d="M8 2.5l6 10.5H2z"/><path d="M8 7v2.5M8 11.2v.01"/>',

  eye: '<path d="M1.6 8C3.3 5 5.5 3.7 8 3.7s4.7 1.3 6.4 4.3c-1.7 3-3.9 4.3-6.4 4.3S3.3 11 1.6 8z"/><circle cx="8" cy="8" r="1.9" fill="currentColor"/>',
  void: '<circle cx="8" cy="8" r="5.4" stroke-dasharray="1.5 2.3"/><circle cx="8" cy="8" r=".9" fill="currentColor"/>',
  dots: '<circle cx="3.6" cy="8" r="1.05" fill="currentColor"/><circle cx="8" cy="8" r="1.05" fill="currentColor"/><circle cx="12.4" cy="8" r="1.05" fill="currentColor"/>',
  pause: '<path d="M5.8 4.2v7.6M10.2 4.2v7.6" stroke-width="2"/>',
  bolt: '<path fill="currentColor" stroke-linejoin="round" d="M9.2 1.8L3.6 9.2h3.7l-.6 5L12.4 7H8.7z"/>',
  swoosh: '<path d="M2.8 8.6c1.5 1 2.6 2.2 3.5 3.8C8 8.5 10.5 5.5 13.4 3.4"/>',
  leap: '<path d="M2.6 10.6C4 6 8 4.4 12.4 6.2M9.4 3.6l3.2 2.7-3.4 2.5"/>',
  frames: '<rect x="4.6" y="2.4" width="9" height="8.2" rx="2"/><path d="M2.4 5.6v5.2a2.6 2.6 0 0 0 2.6 2.6h5.2"/><circle cx="8" cy="5.9" r="1"/>',
  list: '<path d="M5.4 4.4h8.2M5.4 8h8.2M5.4 11.6h8.2"/><circle cx="2.6" cy="4.4" r=".7" fill="currentColor"/><circle cx="2.6" cy="8" r=".7" fill="currentColor"/><circle cx="2.6" cy="11.6" r=".7" fill="currentColor"/>',
  grid: '<rect x="2.2" y="2.2" width="4.8" height="4.8" rx="1.2"/><rect x="9" y="2.2" width="4.8" height="4.8" rx="1.2"/><rect x="2.2" y="9" width="4.8" height="4.8" rx="1.2"/><rect x="9" y="9" width="4.8" height="4.8" rx="1.2"/>',
  flow: '<rect x="5.2" y="2.6" width="5.6" height="9" rx="1.3"/><path d="M2.4 4.6v5M13.6 4.6v5"/><path d="M5.2 14h5.6" opacity=".55"/>',
};
const icon = n => `<svg class="i" viewBox="0 0 16 16" aria-hidden="true">${ICONS[n]}</svg>`;

/* ------------------------------------------------------------------ sound */
/* The click wheel, made here rather than played from a file. A sound for passing over something, the same one fuller for doing it.
   A browser keeps a page silent until its first click or key press, unless the site is allowed sound, so it is asked at once and again on each of those. */
let soundOn = true, audio = null, lastSound = 0, lastName = '';
try { soundOn = localStorage.getItem('sound') !== 'off'; } catch (e) {}
/* A sound is its layers: `snap` a dry burst of noise with no pitch (the contact), `ring` a decaying pitch, `thump` a low one (the body), `lift` a fainter snap
   later on (the dome letting go). The centre button is a switch under the finger, not a tone. */
/* A real iPod classic, measured from 45 clicks of its wheel: five tones around 5.5 kHz, each [Hz, level], held for 1.2 ms and gone in about 5, with a dry edge of noise.
   Nearly all of it lies between 3 and 6 kHz, and the recording has no thump. Numbers fitted against that recording, band by band, within 0.1 dB from 3 to 16 kHz.
   `gain` is its loudness alone: hearing is at its sharpest in this range, and a page can't see the Mac's volume, so it stays low enough to be comfortable with that turned up. */
const WHEEL = { ms: 14, gain: .25, hold: .0012, fade: .0015, snap: [.00035, .031], modes: [[5543, .125], [4875, .068], [4512, .062], [3328, .055], [3820, .018], [8625, .011], [6387, .007], [9785, .007], [7793, .006]] };
const SOUNDS = {
  tick: { ...WHEEL, gain: .18 },
  ipod: WHEEL,
  dome: { ms: 75, snap: [.0014, .34], thump: [210, .007, .16], lift: [.046, .0009, .1] },
  soft: { ms: 40, snap: [.0009, .1], thump: [150, .011, .3] },
  sharp: { ms: 12, ring: [2100, .0018, .2], snap: [.0008, .1] },
};
const CLICKS = { ipod: 'iPod', soft: 'Soft', dome: 'Button', sharp: 'Sharp' };
let clickStyle = 'ipod';
try { if (CLICKS[localStorage.getItem('clickSound')]) clickStyle = localStorage.getItem('clickSound'); } catch (e) {}
function soundBuffer({ ms, ring, thump, snap, lift, modes, hold = 0, fade = 1, gain = 1 }) {
  const buffer = audio.createBuffer(1, Math.ceil(audio.sampleRate * ms / 1000), audio.sampleRate), data = buffer.getChannelData(0);
  let last = 0;
  for (let i = 0; i < data.length; i++) {
    const t = i / audio.sampleRate, white = Math.random() * 2 - 1, bright = white - last; last = white;  // the difference keeps the noise high and dry
    let v = 0;
    if (ring) v += ring[2] * Math.sin(2 * Math.PI * ring[0] * t) * Math.exp(-t / ring[1]);
    if (thump) v += thump[2] * Math.sin(2 * Math.PI * thump[0] * t) * Math.exp(-t / thump[1]);
    if (snap) v += snap[1] * bright * Math.exp(-t / snap[0]);
    if (lift && t >= lift[0]) v += lift[2] * bright * Math.exp(-(t - lift[0]) / lift[1]);
    if (modes) { const body = t < hold ? 1 : Math.exp(-(t - hold) / fade); for (const [hz, level] of modes) v += level * body * Math.sin(2 * Math.PI * hz * t); }
    data[i] = v * gain;
  }
  return buffer;
}
function wakeSound() {
  if (!audio) {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    for (const sound of Object.values(SOUNDS)) sound.buffer = soundBuffer(sound);
  }
  if (audio.state === 'suspended') audio.resume();
}
addEventListener('pointerdown', wakeSound, true); addEventListener('keydown', wakeSound, true);
wakeSound();
function play(name) {
  if (!soundOn || !audio || audio.state !== 'running') return;
  const now = performance.now();
  if (name === 'tick' && now - lastSound < (lastName === 'click' ? 120 : 28)) return;  // one sound at a time; a fast sweep stays a purr, not a buzz
  lastSound = now; lastName = name;
  const source = audio.createBufferSource(); source.buffer = SOUNDS[name === 'click' ? clickStyle : name].buffer; source.connect(audio.destination); source.start();
}
let lastHover = null, pointerX = -1, pointerY = -1;
document.addEventListener('mousemove', ev => { pointerX = ev.clientX; pointerY = ev.clientY; }, { passive: true });
// Only the library's own things and what is done to them; the sidebar, the toolbar and the sheets are quiet.
const SOUND_HOVERS = '[data-item], .sp-row, .ar-album';
const SOUND_ACTIONS = '.fi.c[data-item], [data-item] button, [data-item] input, .sp-row, .sp-bar button, .ar-album, [data-cover], [data-picture], [data-verb], [data-sel]';
document.addEventListener('mouseover', ev => {
  const el = ev.target.closest?.(SOUND_HOVERS) ?? null;
  if (el === lastHover) return;
  lastHover = el;
  // Only a pointer that moved: a list scrolling or redrawing under a still one puts new things beneath it, silently.
  if (el && (ev.clientX !== pointerX || ev.clientY !== pointerY)) play('tick');
});
document.addEventListener('click', ev => {
  if (ev.target.closest?.('.fi:not(.c)')) return;  // moving through covers is the wheel: it ticks as it goes
  if (ev.target.closest?.(SOUND_ACTIONS)) play('click');
}, true);

/* ----------------------------------------------------------------- player */
/* One audio element outside the page's redraws, so a song carries on whatever screen is open, and a queue of song ids. */
const player = { audio: new Audio(), queue: [], at: -1, failed: 0 };
const nowId = () => player.queue[player.at];
const songProgress = () => { const a = player.audio; return a.duration ? (a.currentTime / a.duration * 100).toFixed(1) : 0; };
let songIndex = { library: null, byId: new Map() };
const songById = id => {
  if (songIndex.library !== state.library) songIndex = { library: state.library, byId: new Map((state.library?.songs ?? []).map(s => [s.id, s])) };
  return songIndex.byId.get(id);
};
const inOrder = songs => [...songs].sort((a, b) => a.album.localeCompare(b.album) || (a.disc - b.disc) || (a.track - b.track) || a.title.localeCompare(b.title));
function playSongs(songs, from = 0) {
  if (!songs.length) return;
  if (offline()) return toast('The iPod isn’t connected, so nothing can play.');
  player.queue = songs.map(s => s.id); player.at = from; player.failed = 0; loadSong();
}
function loadSong() {
  player.audio.src = `/audio/${nowId()}`;
  player.audio.play().catch(() => {});  // a song that cannot play says so through its error event
  showPlaying();
}
function stopPlaying() { player.audio.pause(); player.audio.removeAttribute('src'); player.audio.load(); player.queue = []; player.at = -1; showPlaying(); }
function shownSongs() {  // what is on screen, for Play with nothing queued and for a song played from the Songs list
  const q = query.toLowerCase(), has = s => !q || [s.title, s.artist, s.album].some(x => x.toLowerCase().includes(q));
  return (route === 'songs' ? ordered(state.library.songs) : inOrder(state.library.songs)).filter(has);
}
function togglePlay() {
  if (!state.library) return;
  if (!player.queue.length) return playSongs(shownSongs());
  player.audio.paused ? player.audio.play().catch(() => {}) : player.audio.pause();
}
function skipSong(n) {
  if (!state.library) return;
  if (!player.queue.length) return playSongs(shownSongs());
  if (n < 0 && player.audio.currentTime > 3) { player.audio.currentTime = 0; return; }  // as on an iPod: back goes to the start of the song first
  const next = player.at + n;
  if (next < 0) { player.audio.currentTime = 0; return; }
  if (next >= player.queue.length) return stopPlaying();
  player.at = next; loadSong();
}
function playFrom(id) {  // a song of the open album: on through the album
  const s = songById(id); if (!s) return;
  const songs = inOrder(songsOf(`${s.albumArtist} | ${s.album}`));
  playSongs(songs, songs.findIndex(x => x.id === id));
}
function playItems(kind, keys) {
  if (kind === 'song' && keys.length === 1) {
    if (route !== 'songs' || albumSheet.open) return playFrom(+keys[0]);
    const songs = shownSongs();
    return playSongs(songs, Math.max(0, songs.findIndex(x => x.id === +keys[0])));
  }
  playSongs(kind === 'song' ? keys.map(songById).filter(Boolean) : keys.flatMap(k => inOrder(songsFor(kind, k))));
}

  if (ev.target.closest('button, .seal, .detail, input, a')) return;
  const row = ev.target.closest('.sp-row'); if (row) { getSelection()?.removeAllRanges(); return playFrom(+row.querySelector('[data-sid]').dataset.sid); }
  const el = ev.target.closest('[data-item], [data-ak]'); if (!el || (el.classList.contains('fi') && libView === 'flow' && route !== 'covers')) return;
  getSelection()?.removeAllRanges();
  if (el.dataset.item) play('click');
  if (el.dataset.item) run(el.dataset.item === 'song' ? 'play' : 'open', el.dataset.item, [el.dataset.item === 'song' ? +el.dataset.key : el.dataset.key]); else openAlbum(el.dataset.ak);
});
function syncBack(panel) {
  const boxes = panel.querySelectorAll('[data-sid]'), n = panel.querySelectorAll('[data-sid]:checked').length;
  panel.querySelector('.sp-count').textContent = countLabel(n, boxes.length);
  panel.querySelector('.sp-clear').hidden = !n;
}
document.addEventListener('change', ev => { const p = ev.target.closest('.sp'); if (p && ev.target.matches('[data-sid]')) syncBack(p); });
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-clear]'); if (!b) return;
  const p = b.closest('.sp'); p.querySelectorAll('[data-sid]').forEach(c => { c.checked = false; }); syncBack(p);
});
function songAction(act, panel) {
  const key = panel.dataset.sp, ids = [...panel.querySelectorAll('[data-sid]:checked')].map(c => +c.dataset.sid);
  const songs = songsOf(key).filter(s => !ids.length || ids.includes(s.id));
  if (act === 'play') return playSongs(inOrder(songs));
  if (act === 'delete') return deleteSongs(songs);
  if (act === 'move') return groupSongs(songs);
  if (act === 'playlist') return addToPlaylist(songs);
  return editSongs(songs, !ids.length ? 'album' : ids.length === 1 ? 'song' : 'songs');
}
document.addEventListener('click', ev => { const b = ev.target.closest('[data-sact]'); if (b) songAction(b.dataset.sact, b.closest('.sp')); });

/* The A-Z strips: press or drag along them. A letter with nothing under it goes to the next one that has something. */
let idxDrag = null;
function idxPick(s, ev) {
  const r = s.getBoundingClientRect(), t = s.classList.contains('v') ? (ev.clientY - r.top) / r.height : (ev.clientX - r.left) / r.width;
  const k = IDX[clamp(Math.floor(t * IDX.length), 0, IDX.length - 1)];
  if (s.id === 'rail') railJump(k); else flowJumpLetter(k);
}
document.addEventListener('pointerdown', ev => { const s = ev.target.closest('.index'); if (!s) return; idxDrag = s; s.setPointerCapture(ev.pointerId); idxPick(s, ev); ev.preventDefault(); });
document.addEventListener('pointermove', ev => { if (idxDrag) idxPick(idxDrag, ev); });
document.addEventListener('pointerup', () => { idxDrag = null; });
scroller().addEventListener('scroll', () => { drawRows(); railSync(); }, { passive: true });
addEventListener('resize', drawRows);
window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (ROUTES[r] && r !== route) go(r); });
reading = true; render();
new ResizeObserver(() => document.querySelector('.content').style.setProperty('--bar', `${document.querySelector('.toolbar').offsetHeight}px`)).observe(document.querySelector('.toolbar'));  // the bar grows when a narrow window wraps it, and the content starts under it
refresh();
</script>
