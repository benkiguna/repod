<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 61.8 103.5" width="61.8mm" height="103.5mm" role="img" aria-label="Music library app logo">
  <!-- Body proportions: 61.8 × 103.5 mm (5th-gen classic player). 1 unit = 1 mm. -->
  <style>
    .body{fill:#16181D}
    .screen{fill:#F4F4F1}
    .ink{fill:#B4B8C1}
    .chev{stroke:#B4B8C1}
    .hl{fill:#2F6FEB}
    .hlink{fill:#FFFFFF}
    .hlchev{stroke:#FFFFFF}
    .wheel{fill:#F4F4F1}
    .center{fill:#16181D}
    .dot{fill:#9AA0AB}
    @media (prefers-color-scheme: dark){
      .body{fill:#F4F4F1}
      .screen{fill:#16181D}
      .ink{fill:#4A4F5A}
      .chev{stroke:#4A4F5A}
      .hl{fill:#5B8CFF}
      .hlink{fill:#0E1015}
      .hlchev{stroke:#0E1015}
      .wheel{fill:#16181D}
      .center{fill:#F4F4F1}
      .dot{fill:#5E6470}
    }
  </style>
  <defs>
    <clipPath id="scr"><rect x="5.5" y="9.5" width="50.8" height="38.1" rx="1.6"/></clipPath>
  </defs>

  <!-- Body -->
  <rect class="body" x="0" y="0" width="61.8" height="103.5" rx="7"/>

  <!-- Screen (2.5" diagonal, 4:3) -->
  <rect class="screen" x="5.5" y="9.5" width="50.8" height="38.1" rx="1.6"/>
  <g clip-path="url(#scr)">
    <!-- title bar -->
    <rect class="ink" x="23.9" y="11.6" width="14" height="1.7" rx="0.85"/>
    <rect class="ink" x="5.5" y="15.2" width="50.8" height="0.4"/>
    <!-- library rows -->
    <rect class="ink" x="9" y="19.2" width="22" height="2.2" rx="1.1"/>
    <polyline class="chev" points="49.6,19.1 51.2,20.3 49.6,21.5" fill="none" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/>

    <rect class="hl" x="5.5" y="23.8" width="50.8" height="7"/>
    <rect class="hlink" x="9" y="26.2" width="28" height="2.2" rx="1.1"/>
    <polyline class="hlchev" points="49.6,26.1 51.2,27.3 49.6,28.5" fill="none" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/>

    <rect class="ink" x="9" y="33.2" width="18" height="2.2" rx="1.1"/>
    <polyline class="chev" points="49.6,33.1 51.2,34.3 49.6,35.5" fill="none" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/>

    <rect class="ink" x="9" y="40.2" width="25" height="2.2" rx="1.1"/>
    <polyline class="chev" points="49.6,40.1 51.2,41.3 49.6,42.5" fill="none" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Click wheel -->
  <circle class="wheel" cx="30.9" cy="74.5" r="17.5"/>
  <circle class="dot" cx="30.9" cy="62.35" r="0.9"/>
  <circle class="dot" cx="30.9" cy="86.65" r="0.9"/>
  <circle class="dot" cx="18.75" cy="74.5" r="0.9"/>
  <circle class="dot" cx="43.05" cy="74.5" r="0.9"/>
  <circle class="center" cx="30.9" cy="74.5" r="6.8"/>
</svg>
